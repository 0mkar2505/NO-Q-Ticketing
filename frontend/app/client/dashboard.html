<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Dashboard | NO-Q</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>

<body>
  <div class="page-wrapper">
    <header id="navbar"></header>

    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="app-content dashboard-page dashboard-page--client">
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">
          Overview of your support activity
        </p>

        <div class="stats-grid dashboard-stats-grid">
          <div class="stat-card stat-card--open">
            <h3>Unresolved Tickets</h3>
            <p class="stat-number" id="dash-unresolved">0</p>
          </div>

          <div class="stat-card stat-card--pending">
            <h3>Open</h3>
            <p class="stat-number" id="dash-open">0</p>
          </div>

          <div class="stat-card stat-card--resolved">
            <h3>Resolved</h3>
            <p class="stat-number" id="dash-resolved">0</p>
          </div>

          <div class="stat-card stat-card--ai">
            <h3>Total Tickets</h3>
            <p class="stat-number" id="dash-total">0</p>
          </div>
        </div>

        <div class="dashboard-actions">
          <a href="./create-ticket.html" class="primary-btn dashboard-primary-btn">
            + Create Ticket
          </a>
        </div>
      </main>
    </div>

    <footer class="app-footer">
      &copy; 2026 NO-Q
    </footer>
  </div>

  <script src="/shared/js/auth-guard.js"></script>
  <script src="/shared/js/load-shared.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
