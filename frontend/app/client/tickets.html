<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tickets | NO-Q</title>

  <link rel="stylesheet" href="/assets/css/style.css" />
</head>

<body>
  <div class="page-wrapper">

    <!-- Navbar (shared) -->
    <header id="navbar"></header>

    <!-- App layout -->
    <div class="app-layout">

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar"></aside>

      <!-- Main content -->
      <main class="app-content">
        <h1 class="page-title">Support Tickets</h1>
        <p class="page-subtitle">
          Manage customer support tickets
        </p>
        <p id="tickets-feedback" class="tickets-feedback hidden" aria-live="polite"></p>

        <section class="ticket-create-card">
          <h2>Create Ticket</h2>
          <div class="ticket-create-grid">
            <div class="settings-field">
              <label for="create-subject">Subject</label>
              <input id="create-subject" type="text" placeholder="Login issue on checkout page" />
            </div>
            <div class="settings-field">
              <label for="create-customer-email">Customer Email</label>
              <input id="create-customer-email" type="email" placeholder="customer@company.com" />
            </div>
          </div>
          <div class="settings-field">
            <label for="create-message">Initial Customer Message</label>
            <textarea id="create-message" placeholder="Describe the issue details..."></textarea>
          </div>
          <button id="create-ticket-btn" class="btn btn-primary" type="button">Create Ticket</button>
        </section>

        <div class="tickets-container">
          <div id="ticket-list" class="ticket-list"></div>

          <div id="ticket-view" class="ticket-view hidden">
            <h3 id="ticket-subject"></h3>
            <span id="ticket-status" class="ticket-status"></span>

            <div id="messages" class="messages"></div>

            <div class="reply-section">
              <textarea id="reply-box" placeholder="Type your reply..."></textarea>
              <button id="send-reply" class="auth-btn">Send Reply</button>
            </div>

            <button id="resolve-ticket" class="btn btn-secondary">Resolve Ticket</button>

            <section class="ticket-ai-panel">
              <div class="ticket-ai-head">
                <h4>AI Assist</h4>
                <button id="run-ai-assist" class="btn btn-secondary" type="button">Generate</button>
              </div>
              <p id="ai-priority" class="ticket-ai-priority">Priority Suggestion: -</p>
              <p id="ai-summary" class="ticket-ai-summary">Summary will appear here after generation.</p>
            </section>
          </div>
        </div>
      </main>

    </div>

    <!-- Minimal app footer -->
    <footer class="app-footer">
      &copy; 2026 NO-Q
    </footer>

  </div>

  <script src="/shared/js/auth-guard.js"></script>
  <script src="/shared/js/load-shared.js"></script>
  <script src="/app/client/tickets.js"></script>
</body>
</html>
