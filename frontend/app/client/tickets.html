<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tickets | NO-Q</title>

  <link rel="stylesheet" href="/assets/css/style.css" />
</head>

<body>
  <div class="page-wrapper">

    <!-- Navbar (shared) -->
    <header id="navbar"></header>

    <!-- App layout -->
    <div class="app-layout">

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar"></aside>

      <!-- Main content -->
      <main class="app-content">
        <h1 class="page-title">Support Tickets</h1>
        <p class="page-subtitle">
          Manage customer support tickets
        </p>
        <p id="tickets-feedback" class="tickets-feedback hidden" aria-live="polite"></p>
        <section class="ticket-toolbar">
          <input id="ticket-search" type="text" placeholder="Search subject, category, or customer email" />
          <select id="ticket-filter-status">
            <option value="all">All Statuses</option>
            <option value="open">Open</option>
            <option value="pending">Pending</option>
            <option value="resolved">Resolved</option>
          </select>
          <select id="ticket-filter-priority">
            <option value="all">All Priorities</option>
            <option value="high">High</option>
            <option value="normal">Normal</option>
            <option value="low">Low</option>
            <option value="unspecified">Unspecified</option>
          </select>
          <select id="ticket-sort">
            <option value="updated_desc">Newest Updated</option>
            <option value="updated_asc">Oldest Updated</option>
            <option value="created_desc">Newest Created</option>
            <option value="created_asc">Oldest Created</option>
            <option value="priority_desc">Priority High to Low</option>
            <option value="priority_asc">Priority Low to High</option>
          </select>
        </section>

        <div class="tickets-container">
          <div id="ticket-list" class="ticket-list"></div>

          <div id="ticket-view" class="ticket-view hidden">
            <div class="ticket-view-head">
              <div>
                <h3 id="ticket-subject"></h3>
                <span id="ticket-status" class="ticket-status"></span>
                <p id="ticket-meta" class="ticket-meta"></p>
              </div>
              <div class="ticket-view-actions">
                <button id="ticket-refresh" class="btn btn-secondary" type="button" disabled>Refresh</button>
              </div>
            </div>

            <div id="messages" class="messages"></div>

            <div class="reply-section">
              <textarea id="reply-box" placeholder="Type your reply..."></textarea>
              <button id="send-reply" class="auth-btn">Send Reply</button>
            </div>

            <button id="resolve-ticket" class="btn btn-secondary">Resolve Ticket</button>

            <section class="ticket-ai-panel">
              <div class="ticket-ai-head">
                <h4>AI Assist</h4>
                <button id="run-ai-assist" class="btn btn-secondary" type="button">Generate</button>
              </div>
              <p id="ai-priority" class="ticket-ai-priority">Priority Suggestion: -</p>
              <p id="ai-summary" class="ticket-ai-summary">Summary will appear here after generation.</p>
            </section>
          </div>
        </div>
        <div class="ticket-pagination">
          <button id="ticket-prev-page" class="btn btn-secondary" type="button">Prev</button>
          <span id="ticket-page-info">Page 1 of 1</span>
          <button id="ticket-next-page" class="btn btn-secondary" type="button">Next</button>
        </div>
      </main>

    </div>

    <!-- Minimal app footer -->
    <footer class="app-footer">
      &copy; 2026 NO-Q
    </footer>

  </div>

  <script src="/shared/js/auth-guard.js"></script>
  <script src="/shared/js/load-shared.js"></script>
  <script src="/shared/js/api.js"></script>
  <script src="/app/client/tickets.js"></script>
</body>
</html>
