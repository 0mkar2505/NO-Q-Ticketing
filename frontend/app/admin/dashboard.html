<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | NO-Q</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="page-wrapper">
    <header id="navbar"></header>

    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="app-content dashboard-page dashboard-page--admin">
        <h1 class="page-title">Admin Dashboard</h1>
        <p class="page-subtitle">
          Platform overview and system insights
        </p>

        <div class="stats-grid dashboard-stats-grid">
          <div class="stat-card stat-card--open">
            <h3>Total Clients</h3>
            <p class="stat-number" id="admin-total-clients">-</p>
          </div>

          <div class="stat-card stat-card--pending">
            <h3>Total Tickets</h3>
            <p class="stat-number" id="admin-total-tickets">-</p>
          </div>

          <div class="stat-card stat-card--resolved">
            <h3>Active Users</h3>
            <p class="stat-number" id="admin-active-users">-</p>
          </div>

          <div class="stat-card stat-card--ai">
            <h3>System Status</h3>
            <p class="stat-number" id="admin-system-status">-</p>
          </div>
        </div>

        <section class="admin-section-grid">
          <article class="admin-section-card">
            <div class="admin-section-head">
              <h2>Recent Platform Activity</h2>
              <a class="admin-badge" href="./activity.html">View all</a>
            </div>
            <ul class="admin-activity-list" id="admin-activity-list">
              <li class="admin-empty-copy">Loading activity...</li>
            </ul>
          </article>

          <article class="admin-section-card">
            <div class="admin-section-head">
              <h2>Operational Health</h2>
              <a class="admin-badge" href="./health.html">Details</a>
            </div>
            <div class="admin-kv-list" id="admin-health-kv">
              <div class="admin-empty-copy">Loading health...</div>
            </div>
          </article>
        </section>
      </main>
    </div>

    <footer class="app-footer">
      &copy; 2026 NO-Q
    </footer>
  </div>

  <script src="/shared/js/auth-guard.js"></script>
  <script src="/shared/js/load-shared.js"></script>
  <script src="/shared/js/api.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
