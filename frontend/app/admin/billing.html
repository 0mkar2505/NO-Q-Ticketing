<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing | NO-Q Admin</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="page-wrapper">
    <header id="navbar"></header>

    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="app-content">
        <h1 class="page-title">Billing</h1>
        <p class="page-subtitle">
          Subscription plans, invoices, and platform revenue controls
        </p>
        <p id="admin-billing-feedback" class="tickets-feedback hidden" aria-live="polite"></p>

        <section class="admin-section-grid">
          <article class="admin-section-card">
            <div class="admin-section-head">
              <h2>Plan Catalog</h2>
              <span class="admin-badge" id="billing-total-clients">0 clients</span>
            </div>
            <div id="billing-plan-summary" class="admin-kv-list">
              <div><span>Free</span><strong>0</strong></div>
              <div><span>Starter</span><strong>0</strong></div>
              <div><span>Growth</span><strong>0</strong></div>
              <div><span>Enterprise</span><strong>0</strong></div>
            </div>
          </article>

          <article class="admin-section-card">
            <div class="admin-section-head">
              <h2>Recent Invoices</h2>
              <span class="admin-badge">Latest</span>
            </div>
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Invoice</th>
                  <th>Company</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="billing-invoices-body">
                <tr>
                  <td colspan="3" class="admin-table-empty">Loading invoices...</td>
                </tr>
              </tbody>
            </table>
          </article>
        </section>

        <section class="admin-section-card">
          <div class="admin-section-head">
            <h2>Billing Rules</h2>
            <span class="admin-badge">Config</span>
          </div>

          <div class="admin-form-grid">
            <div class="admin-field">
              <label for="graceDays">Payment Grace Period (days)</label>
              <input id="graceDays" type="number" value="7" />
            </div>

            <div class="admin-field">
              <label for="currency">Default Currency</label>
              <select id="currency">
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="INR">INR</option>
              </select>
            </div>
          </div>

          <div class="settings-actions">
            <button id="billing-discard-btn" class="btn btn-secondary" type="button">Discard</button>
            <button id="billing-save-btn" class="btn btn-primary" type="button">Save Rules</button>
          </div>
        </section>
      </main>
    </div>

    <footer class="app-footer">
      &copy; 2026 NO-Q
    </footer>
  </div>

  <script src="/shared/js/auth-guard.js"></script>
  <script src="/shared/js/load-shared.js"></script>
  <script src="./billing.js"></script>
</body>
</html>
