<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NO-Q | Onboarding</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" type="image/png" href="/assets/images/NO-Q%20logo%201.png" />
</head>

<body class="page-transition theme-dark">
  <div class="page-wrapper">
    <!-- AUTH NAVBAR - SIMPLIFIED -->
    <header class="navbar navbar--auth">
      <div class="navbar-left">
        <img src="/assets/images/NO-Q%20logo%201.png" alt="NO-Q Logo" class="navbar-logo" />
        <span class="navbar-brand">NO-Q</span>
      </div>

      <div class="navbar-right">
        <a href="/public/index.html" class="btn btn-secondary">
          Home
        </a>
      </div>
    </header>

    <!-- REGISTER FORM -->
    <main class="auth-page">
      <div class="auth-card">
        <h1 class="auth-title">Onboarding</h1>
        <p class="auth-subtitle">
          Create your NO-Q workspace and continue to pricing.
        </p>

        <form id="registerForm">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="John Doe"
              required
            />
          </div>

          <div class="form-group">
            <label for="company">Company name</label>
            <input
              type="text"
              id="company"
              name="company"
              placeholder="Your company name"
              required
            />
          </div>

          <div class="form-group">
            <label for="industry">Industry</label>
            <input
              type="text"
              id="industry"
              name="industry"
              placeholder="SaaS, E-commerce, FinTech..."
            />
          </div>

          <div class="form-group">
            <label for="website">Company website</label>
            <input
              type="text"
              id="website"
              name="website"
              placeholder="https://example.com"
            />
          </div>

          <div class="form-group">
            <label for="companySize">Company size</label>
            <select id="companySize" name="companySize">
              <option value="">Select...</option>
              <option value="1-10">1-10</option>
              <option value="11-50">11-50</option>
              <option value="51-200">51-200</option>
              <option value="201-1000">201-1000</option>
              <option value="1000+">1000+</option>
            </select>
          </div>

          <div class="form-group">
            <label for="handle">NO-Q email</label>
            <div class="password-wrapper">
              <input
                type="text"
                id="handle"
                name="handle"
                placeholder="your-company-admin"
                required
              />
              <span style="padding: 0 10px; color: #64748b; font-weight: 700;">@noq.com</span>
            </div>
            <p class="settings-copy" style="margin-top: 8px;">
              This becomes your sign-in email. Example: <strong>your-company-admin@noq.com</strong>
            </p>
          </div>

          <div class="form-group password-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
              />
              <button
                type="button"
                class="toggle-password"
                aria-label="Show password"
              >
                👁
              </button>
            </div>
          </div>

          <div class="form-group password-group">
            <label for="confirmPassword">Confirm Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
              />
              <button
                type="button"
                class="toggle-password"
                aria-label="Show password"
              >
                👁
              </button>
            </div>
          </div>

          <button type="submit" class="auth-btn" id="submitBtn">Continue to Pricing</button>
        </form>

        <p id="error" class="form-error"></p>

        <p class="auth-switch">
          Already onboarded?
          <a href="/auth/login.html">Sign in</a>
        </p>
      </div>
    </main>

    <!-- FOOTER (SIMPLE AUTH) -->
    <footer class="site-footer site-footer--auth">
      <div class="footer-divider"></div>

      <div class="footer-bottom auth-footer-content">
        <p class="footer-quote">
          <strong>NO-Q</strong> — because waiting is not support.
        </p>

        <div class="footer-socials">
          <a href="https://github.com/0mkar2505" target="_blank" aria-label="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>

          <a href="https://www.linkedin.com/in/omkar-zad" target="_blank" aria-label="LinkedIn">
            <i class="fa-brands fa-linkedin"></i>
          </a>
        </div>
      </div>
    </footer>
  </div>

  <!-- SUCCESS MODAL -->
  <div id="successModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h2>Onboarding started</h2>
      <p class="modal-subtext">
        Next: choose a plan and complete checkout.
      </p>
      <button id="goToLoginBtn" class="auth-btn">
        Continue to Pricing
      </button>
    </div>
  </div>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/validators.js"></script>
  <script src="/assets/js/register.js"></script>
  <script src="/shared/js/page-transition.js"></script>
</body>
</html>
